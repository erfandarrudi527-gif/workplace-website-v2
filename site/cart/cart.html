<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سبد خرید | آریا استور</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234338ca'/%3E%3Cpath d='M16 6l3.09 6.26L26 13.27l-5 4.87 1.18 6.88L16 19.77l-6.18 3.25L11 16.14 6 11.27l6.91-1.01L16 6z' fill='white'/%3E%3C/svg%3E"/>

  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="../animations.css" />
  <link rel="stylesheet" href="../premium.css">
  </head>
<body class="dark">
<header class="navbar">
    <div class="navbar-container">
      <a href="../products/products.html" class="navbar-logo">
        <span class="logo-icon"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
        <span>آریا استور</span>
      </a>

      <nav class="navbar-menu">
        <a href="../index.html" class="nav-link">خانه</a>
        <a href="../login/login.html" class="login-btn" aria-label="ورود به حساب کاربری">
          <span class="login-icon"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span>ورود</span>
        </a>
        <a href="cart.html" class="cart-btn" aria-label="سبد خرید">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span id="cartCount" class="cart-badge hidden">۰</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="cart-main">
    <div class="page-title">
      <h1>سبد خرید</h1>
      <p class="subtitle">موارد انتخابی شما</p>
    </div>

    <a href="../products/products.html" class="back-shop"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> بازگشت به محصولات</a>

    <div class="cart-list" id="cartList"></div>

    <div class="cart-empty" id="cartEmpty" hidden>
      <span class="empty-icon"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
      <p>سبد خرید شما خالی است.</p>
      <a href="../products/products.html" class="continue-btn">مشاهده محصولات</a>
    </div>

    <div class="cart-summary" id="cartSummary" hidden>
      <div class="summary-lines">
        <div class="summary-line">
          <span>جمع کل</span>
          <span id="cartTotal">۰ تومان</span>
        </div>
        <div class="summary-line discount-line" id="discountRow" hidden>
          <span>تخفیف</span>
          <span id="discountAmount">۰</span>
        </div>
        <div class="summary-line total-line">
          <span>قابل پرداخت</span>
          <span id="cartPayable">۰ تومان</span>
        </div>
      </div>

      <div class="discount-box">
        <input type="text" id="discountInput" class="discount-input" placeholder="کد تخفیف (مثال: OFF10)" />
        <button type="button" id="discountBtn" class="discount-btn">اعمال کد</button>
      </div>
      <p class="discount-msg" id="discountMsg"></p>

      <button class="checkout-btn" id="checkoutBtn" type="button">پرداخت نهایی</button>
      <a href="../products/products.html" class="continue-btn">ادامه خرید</a>
    </div>
  </main>

  <script src="../data.js"></script>

  <script src="cart.js"></script>
  <script src="../animations.js"></script>
</body>
</html>
