<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>داشبورد کاربری</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234338ca'/%3E%3Cpath d='M16 6l3.09 6.26L26 13.27l-5 4.87 1.18 6.88L16 19.77l-6.18 3.25L11 16.14 6 11.27l6.91-1.01L16 6z' fill='white'/%3E%3C/svg%3E"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../animations.css" />
  <link rel="stylesheet" href="../premium.css">
  </head>
<body class="dark">
<header class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-logo">
        <span class="logo-icon"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
        <span>داشبورد من</span>
      </a>
      <nav class="navbar-menu">
        <a href="../index.html" class="nav-link">خانه</a>
        <a href="../user/dashboard.html" class="nav-link active">داشبورد</a>
        <a href="../products/products.html" class="nav-link">محصولات</a>
        <a href="../blog/blog.html" class="nav-link">وبلاگ</a>
        <a href="../cart/cart.html" class="cart-btn" aria-label="سبد خرید">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span id="cartCount" class="cart-badge hidden">۰</span>
        </a>
        <button id="logoutBtn" type="button" class="logout-btn">خروج</button>
      </nav>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="profile-header">
      <div class="profile-avatar"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div class="profile-info">
        <h1 id="userName">کاربر</h1>
        <p id="userEmail">پست الکترونیک</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <section class="dashboard-card">
        <h2><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> سفارشات قبلی</h2>
        <div id="ordersList" class="orders-list"></div>
        <p id="noOrders" class="empty-msg">هنوز سفارشی ثبت نکرده‌اید.</p>
      </section>

      <section class="dashboard-card">
        <h2><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> علاقه‌مندی‌ها</h2>
        <div class="tabs">
          <button class="tab-btn active" data-tab="wishlist-products">محصولات</button>
          <button class="tab-btn" data-tab="wishlist-blogs">وبلاگ‌ها</button>
        </div>
        <div id="wishlist-products" class="tab-content active">
          <p class="wishlist-header"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> محصولات مورد علاقه من</p>
          <div id="wishlistProducts" class="wishlist-grid"></div>
          <p id="noProductWish" class="empty-msg">محصولی در علاقه‌مندی‌ها نیست.</p>
        </div>
        <div id="wishlist-blogs" class="tab-content">
          <p class="wishlist-header"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> وبلاگ‌های مورد علاقه من</p>
          <div id="wishlistBlogs" class="wishlist-grid"></div>
          <p id="noBlogWish" class="empty-msg">مطلبی در علاقه‌مندی‌ها نیست.</p>
        </div>
      </section>

      <section class="dashboard-card">
        <h2><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> سبد خرید</h2>
        <div id="dashCartList" class="dash-cart-list"></div>
        <p id="noCartItems" class="empty-msg">سبد خرید شما خالی است.</p>
        <div id="dashCartSummary" class="dash-cart-summary hidden">
          <div class="summary-line">
            <span>جمع کل</span>
            <span id="dashCartTotal">۰ تومان</span>
          </div>
          <a href="../cart/cart.html" class="hero-btn primary" style="margin-top:12px;display:inline-block;">مشاهده سبد خرید</a>
        </div>
      </section>
    </div>
  </main>

  <script src="../data.js"></script>

  <script src="dashboard.js"></script>
  <script src="../animations.js"></script>
</body>
</html>
