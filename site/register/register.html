<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | آریا استور</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234338ca'/%3E%3Cpath d='M16 6l3.09 6.26L26 13.27l-5 4.87 1.18 6.88L16 19.77l-6.18 3.25L11 16.14 6 11.27l6.91-1.01L16 6z' fill='white'/%3E%3C/svg%3E"/>

    <link rel="stylesheet" href="../auth.css">
  <link rel="stylesheet" href="../animations.css" />
  <link rel="stylesheet" href="../premium.css">
  </head>
<body class="dark">
<div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="cursor-dot" aria-hidden="true"></div>

    <div class="auth-container">
        <form id="registerForm" class="auth-card tilt-card" novalidate>
            <h2>ایجاد حساب کاربری</h2>

            <label for="name">نام کاربری</label>
            <input type="text" id="name" name="name" placeholder="نام کاربری خود را وارد کنید" required autocomplete="name" />

            <label for="email">ایمیل</label>
            <input type="email" id="email" name="email" placeholder="ایمیل خود را وارد کنید" required autocomplete="email" />

            <label for="password">رمز عبور</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" required autocomplete="new-password" minlength="6" />
                <button type="button" class="toggle-password ripple" data-target="password" aria-label="نمایش رمز عبور"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>

            <label for="confirmPassword">تکرار رمز عبور</label>
            <div class="password-field">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="رمز عبور را دوباره وارد کنید" required autocomplete="new-password" minlength="6" />
                <button type="button" class="toggle-password ripple" data-target="confirmPassword" aria-label="نمایش رمز عبور"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>

            <button type="submit" class="ripple">ثبت‌نام</button>
            <p id="registerMessage" class="message"></p>

            <p class="switch-link">قبلاً ثبت‌نام کرده‌اید؟ <a href="../login/login.html">وارد شوید</a></p>
        </form>
    </div>

    <script src="../data.js"></script>

    <script src="register.js"></script>
  <script src="../animations.js"></script>
</body>
</html>
